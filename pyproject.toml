[project]
name = "mirrorballs"
version = "0.1.0"
description = "Beat-driven projection app for a mirror ball"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "ruamel.yaml>=0.18",
    "numpy>=2.5.1",
]

[project.optional-dependencies]
# Output process (no GTK).
render = [
    "glfw>=2.10.1",
    "moderngl>=5.12.0",
    "pillow>=12.3.0",
    "python-rtmidi>=1.5.8",
]
# Controller process (GTK4 + libadwaita). Needs system packages: gir1.2-gtk-4.0 gir1.2-adw-1
# libgirepository-2.0-dev libcairo2-dev pkg-config.
control = [
    "pygobject>=3.50",
    "python-rtmidi>=1.5.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
