<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cantarell:wght@400;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;margin:0;padding:0}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #3fbfae;outline-offset:2px}
@keyframes dcspin{to{transform:rotate(360deg)}}
.spin{animation:dcspin .9s linear infinite;transform-origin:center}
input.rng{-webkit-appearance:none;appearance:none;display:block;width:100%;height:28px;margin:0;background:transparent}
input.rng::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,#3fbfae var(--p),#2d3138 var(--p))}
input.rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:#eceef1;border:0}
input.rng::-moz-range-track{height:8px;border-radius:4px;background:#2d3138}
input.rng::-moz-range-progress{height:8px;border-radius:4px;background:#3fbfae}
input.rng::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#eceef1;border:0}
input.sw{-webkit-appearance:none;appearance:none;position:relative;width:46px;height:26px;margin:0;border-radius:13px;background:#2d3138;border:1px solid #3b404a;flex:none;cursor:pointer}
input.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#eceef1}
input.sw:checked{background:#3fbfae;border-color:#3fbfae}
input.sw:checked::after{left:22px;background:#04211d}
input.sw:disabled{opacity:.45}
select.dd{-webkit-appearance:none;appearance:none;width:100%;background:#23262c;color:#eceef1;border:1px solid #3b404a;border-radius:8px;padding:0 32px 0 12px;font:inherit;font-size:14px}
select.dd:disabled{opacity:.45}
input.tf{background:#101114;color:#eceef1;border:1px solid #3b404a;border-radius:8px;font:inherit;font-size:14px;padding:0 10px}
</style>
</helmet>
<div style="width:280px;height:232px;background:#101114;color:#eceef1;font-family:'Cantarell',system-ui,sans-serif;font-size:14px;line-height:1.35;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;position:relative;overflow:hidden;"><div style="margin:12px;padding:6px;background:#1b1d22;border:1px solid #3b404a;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.5)"><button type="button" style="display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px;border:0;background:transparent;border-radius:8px;text-align:left;font-size:14px"><span style="flex:1">Configuration…</span><span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:5px;font-size:12px;font-weight:700;line-height:1;flex:none;background:#2d3138;color:#b0b5bf;border:1px solid #3b404a">Ctrl+,</span></button><button type="button" style="display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px;border:0;background:transparent;border-radius:8px;text-align:left;font-size:14px"><span style="flex:1">Quit renderer</span></button><div style="height:1px;background:#2a2e35;margin:6px 0"></div><button type="button" style="display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px;border:0;background:transparent;border-radius:8px;text-align:left;font-size:14px"><span style="flex:1">Keyboard shortcuts</span><span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:5px;font-size:12px;font-weight:700;line-height:1;flex:none;background:#2d3138;color:#b0b5bf;border:1px solid #3b404a">Ctrl+?</span></button><button type="button" style="display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px;border:0;background:transparent;border-radius:8px;text-align:left;font-size:14px"><span style="flex:1">About Floorshow</span></button></div></div>
</x-dc>

</body>
</html>
